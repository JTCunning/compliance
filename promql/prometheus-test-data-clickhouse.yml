# Same scrape targets as prometheus-test-data.yml, plus remote_write to ClickHouse.
# Start reference Prometheus with:
#   prometheus --config.file=prometheus-test-data-clickhouse.yml
#
# Prerequisites: ClickHouse listening on 127.0.0.1:9093 with /write (see clickhouse-docker/).

global:
  scrape_interval: 5s

scrape_configs:
- job_name: 'demo'
  static_configs:
    - targets:
      - 'demo.promlabs.com:10000'
      - 'demo.promlabs.com:10001'
      - 'demo.promlabs.com:10002'

remote_write:
  - url: http://127.0.0.1:9093/write
