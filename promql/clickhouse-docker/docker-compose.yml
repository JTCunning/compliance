# Default: Docker Hub clickhouse/clickhouse-server:latest.
# Override image: CLICKHOUSE_IMAGE=ch-promql:local docker compose up -d
# or use docker-compose.override.source.yml.example.

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    container_name: clickhouse-promql-compliance
    # Official image otherwise restricts `default` to loopback; remote_write from the host hits the bridge network.
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    # Host port defaults to 19093 to avoid clashes with other Prometheus/ClickHouse stacks; container listens on 9093.
    ports:
      - "${CLICKHOUSE_PROMETHEUS_HOST_PORT:-19093}:9093"
    volumes:
      - ./config.d/prometheus-compliance.xml:/etc/clickhouse-server/config.d/prometheus-compliance.xml:ro
      - ./users.d/time-series-compliance.xml:/etc/clickhouse-server/users.d/time-series-compliance.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
