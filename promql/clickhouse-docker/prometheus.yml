# Reference Prometheus for the ClickHouse compliance run.
# Same scrape targets as ../prometheus-test-data.yml, plus remote write into
# the ClickHouse TimeSeries table served by the clickhouse service.

global:
  scrape_interval: 5s

scrape_configs:
- job_name: 'demo'
  static_configs:
    - targets:
      - 'demo.promlabs.com:10000'
      - 'demo.promlabs.com:10001'
      - 'demo.promlabs.com:10002'

remote_write:
  - url: http://clickhouse:8123/prometheus/api/v1/write
